spring.application.name=lockedin-backend

# --- Server ---
server.port=${PORT:8080}

# --- Database (Defaults to H2; automatically switches to MySQL when SPRING_DATASOURCE_URL is set) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lockedindb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
lockedin.jwt.secret=${LOCKEDIN_JWT_SECRET:lockedin-demo-secret-key-change-me-0123456789-abcdef}
lockedin.jwt.expiration-ms=86400000

# --- College email restriction (empty = allow any valid email) ---
lockedin.signup.allowed-email-domain=${LOCKEDIN_ALLOWED_EMAIL_DOMAIN:}

# --- Credit economy ---
lockedin.credits.weekly-baseline=10
lockedin.credits.teach-session-reward=8
lockedin.credits.co-study-reward=4
lockedin.credits.doubt-answer-reward=2
lockedin.credits.low-balance-threshold=3

# --- Mail (reminders and notifications) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CORS ---
lockedin.cors.allowed-origin=${LOCKEDIN_CORS_ORIGIN:http://localhost:5173}

# --- JSON ---
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=true
